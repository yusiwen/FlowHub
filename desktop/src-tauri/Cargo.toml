[package]
name = "flowhub-desktop"
version = "0.1.0"
description = "FlowHub desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The child-webview API (WebviewBuilder + Window::add_child) is behind the
# `unstable` feature. Pin the minor version: the API may move between minors.
tauri = { version = "=2.12.4", features = ["unstable"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
