# The desktop gate. It is path-filtered and deliberately separate from ci.yml:
# a Go-only change does not run it, so it must not be a required check.
#
# The runner is the arm64 macOS image. The Rust steps mirror `make desktop-check`
# and the final build bundles the app and asserts the bundle carries the icon and
# the identifier — an .app is the application record macOS takes both from.
name: desktop

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # The multi-webview API needs the stable toolchain plus rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install shell dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # The Tauri build script embeds frontendDist, so the shell must be built
      # before any Rust step compiles the crate.
      - name: Typecheck and build shell
        working-directory: desktop
        run: |
          pnpm exec tsc --noEmit
          pnpm build

      - name: Rust format, lint, test
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The .app is what gives this app an identity: its Info.plist is the record
      # macOS resolves the name, the identifier and the icon from. A build that
      # compiles but bundles nothing is exactly the regression that left a bare
      # executable with a placeholder icon in Stage Manager, so these assertions
      # are the gate, not the build exit code.
      - name: Build the app bundle and assert it carries the icon
        working-directory: desktop
        run: |
          pnpm tauri build --debug --bundles app
          # Trace the assertions: a bare `test -f` that fails says nothing about
          # which file was missing.
          set -x
          app=src-tauri/target/debug/bundle/macos/FlowHub.app
          test -x "$app/Contents/MacOS/flowhub-desktop"
          test -f "$app/Contents/Resources/icon.icns"
          cmp "$app/Contents/Resources/icon.icns" src-tauri/icons/icon.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist" \
            | grep -qx icon.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" \
            | grep -qx cn.yusiwen.flowhub
